name: simple Java CI

on:
    push:
        branches: [test]
    pull_request:
        branches: [test]
permissions:
    contents: read
jobs:
    build-and-test:
        run-on: ubuntu-latest

        steps:
            - name: Checkout source code
              uses: actions/checkout@v4

            - name: Java version - JAVA 17
              uses: actions/setup-java@v4
              with:
                distribution: temurin
                java-version: "17"
                cache: maven

            - name: Compile Java
              run: mvn clean package

