name: simple Java CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
permissions:
    contents: read
jobs:
    build-containerize-push:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source code
              uses: actions/checkout@v4

            - name: Java version - JAVA 17
              uses: actions/setup-java@v4
              with:
                distribution: temurin
                java-version: "17"
                cache: maven

            - name: Compile Java
              run: mvn clean package
            
            - name: Build docker image
              run: docker build -t simple-jave-app:latest .
            
            - name: Push docker image
              run: docker push simple-jave-app:latest

